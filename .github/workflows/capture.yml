name: Capture page + PDF

on:
  schedule:
    # Every 10 minutes: a quick check each time, plus a full browser capture with
    # screenshots at the first run of every 6-hour block and whenever something
    # changes (see capture.py). GitHub's own scheduler is unreliable (late or skipped
    # runs), so an outside scheduler also starts a check every 10 minutes through
    # workflow_dispatch with mode=check. This schedule stays as a backup.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = full capture with screenshots; check = quick check (used by the outside scheduler)"
        type: choice
        options: [full, check]
        default: full
      ignore_window:
        description: "Capture now, even outside the window in config.toml (use this for a test run)"
        type: boolean
        default: false

permissions:
  contents: write   # commit each run to this repository
  actions: write    # switch the schedule off once the window has ended

concurrency:
  group: proof-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      # Only check out the scripts and the log, not the (large) archive itself.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/*/

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright (uses the runner's preinstalled Google Chrome)
        run: |
          pip install --quiet --disable-pip-version-check playwright==1.63.0
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi

      - name: Capture
        id: capture
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: >
          python capture.py
          ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'check' && '--full' || '' }}
          ${{ inputs.ignore_window && '--ignore-window' || '' }}

      - name: Commit
        if: steps.capture.outputs.status == 'captured'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse archive
          git add --sparse tsa-certs 2>/dev/null || true
          git commit --quiet -m "${{ steps.capture.outputs.type == 'full' && 'Full capture' || 'Check' }} ${{ steps.capture.outputs.stamp }}" \
                     -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push --quiet && exit 0
            sleep $((i * 5)); git pull --rebase --quiet
          done
          exit 1

      - name: Alert — something is wrong with the page or the PDF
        if: steps.capture.outputs.alert == 'true'
        env:
          REASON: ${{ steps.capture.outputs.alert_reason }}
        run: |
          echo "::error title=Page or PDF problem::$REASON"
          exit 1

      - name: Window over — switch the schedule off
        if: steps.capture.outputs.status == 'ended'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable capture.yml --repo "$GITHUB_REPOSITORY"
